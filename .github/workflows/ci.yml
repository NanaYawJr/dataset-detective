name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, format and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    name: Publish to Railway
    runs-on: ubuntu-latest
    needs: [check, e2e]
    # Only pushes to main are published, and only after every check has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: dataset-detective
    steps:
      - name: Skip when no deploy token is set
        if: env.RAILWAY_TOKEN == ''
        run: echo "RAILWAY_TOKEN is not set, so nothing was published."
      - uses: actions/checkout@v4
        if: env.RAILWAY_TOKEN != ''
      - name: Build and publish
        if: env.RAILWAY_TOKEN != ''
        run: railway up --ci --service="$RAILWAY_SERVICE"
