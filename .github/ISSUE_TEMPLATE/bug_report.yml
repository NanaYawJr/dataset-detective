name: Bug report
description: Something gave a wrong answer, an error, or didn't load.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Please don't attach real or sensitive data.** A small made-up file that shows the problem is ideal."
  - type: textarea
    id: steps
    attributes:
      label: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 141 on Windows 11
